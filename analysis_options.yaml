analyzer:
  exclude:
    # Enable the optional adapter after adding google_maps_flutter.
    - integrations/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - avoid_print
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
